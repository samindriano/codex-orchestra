<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560">
  <rect width="1000" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/></marker>
    <style>
      .txt { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#0f172a; }
      .small { font-size:13px; }
      .label { font-size:15px; font-weight:600; }
      .title { font-size:19px; font-weight:700; }
      .edge { stroke:#334155; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .edge-green { stroke:#16a34a; stroke-width:2; fill:none; marker-end:url(#arrowGreen); }
      .edge-red { stroke:#dc2626; stroke-width:2; fill:none; marker-end:url(#arrowRed); }
    </style>
  </defs>

  <text x="500" y="32" text-anchor="middle" class="txt title">Concurrency buys speed; stronger models buy judgment</text>
  <text x="500" y="55" text-anchor="middle" class="txt small">Choose worker count and model strength independently.</text>

  <rect x="70" y="92" width="190" height="58" rx="11" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="165" y="117" text-anchor="middle" class="txt label">Meaningful task</text>
  <text x="165" y="137" text-anchor="middle" class="txt small">parallelism preflight</text>
  <line x1="260" y1="121" x2="320" y2="121" class="edge"/>

  <rect x="325" y="82" width="280" height="78" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="465" y="111" text-anchor="middle" class="txt label">MAIN / root</text>
  <text x="465" y="133" text-anchor="middle" class="txt small">cost-efficient strong model</text>
  <text x="465" y="151" text-anchor="middle" class="txt small">e.g. Luna xhigh</text>

  <line x1="465" y1="160" x2="465" y2="204" class="edge"/>
  <rect x="245" y="208" width="440" height="76" rx="13" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="465" y="235" text-anchor="middle" class="txt label">Useful concurrency</text>
  <text x="465" y="257" text-anchor="middle" class="txt small">spawn 1–3 LIGHT or 3–6 HEAVY workers when the frontier supports it</text>
  <text x="465" y="276" text-anchor="middle" class="txt small">routine workers normally use the same cost-efficient strong model</text>

  <path d="M315 284 V322" class="edge"/>
  <path d="M465 284 V322" class="edge"/>
  <path d="M615 284 V322" class="edge"/>
  <rect x="245" y="326" width="140" height="56" rx="10" fill="#ffffff" stroke="#2563eb"/>
  <rect x="395" y="326" width="140" height="56" rx="10" fill="#ffffff" stroke="#2563eb"/>
  <rect x="545" y="326" width="140" height="56" rx="10" fill="#ffffff" stroke="#2563eb"/>
  <text x="315" y="350" text-anchor="middle" class="txt small">Worker A</text>
  <text x="315" y="369" text-anchor="middle" class="txt small">implementation</text>
  <text x="465" y="350" text-anchor="middle" class="txt small">Worker B</text>
  <text x="465" y="369" text-anchor="middle" class="txt small">tests / audit</text>
  <text x="615" y="350" text-anchor="middle" class="txt small">Worker C</text>
  <text x="615" y="369" text-anchor="middle" class="txt small">inspection</text>

  <path d="M315 382 V414 H465" class="edge"/>
  <path d="M465 382 V414" class="edge"/>
  <path d="M615 382 V414 H465" class="edge"/>
  <polygon points="465,404 555,440 465,476 375,440" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="465" y="436" text-anchor="middle" class="txt small">Decision clean?</text>
  <text x="465" y="454" text-anchor="middle" class="txt small">evidence sufficient?</text>

  <path d="M375 440 H225 V500" class="edge-green"/>
  <text x="252" y="430" class="txt small" fill="#15803d">yes</text>
  <rect x="115" y="502" width="220" height="42" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="225" y="528" text-anchor="middle" class="txt label">MAIN integrates</text>

  <path d="M555 440 H775 V322" class="edge-red"/>
  <text x="637" y="430" class="txt small" fill="#dc2626">ambiguous / high-risk</text>
  <rect x="705" y="250" width="240" height="72" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
  <text x="825" y="278" text-anchor="middle" class="txt label">Bounded stronger-model</text>
  <text x="825" y="299" text-anchor="middle" class="txt small">checkpoint (e.g. Sol High)</text>
  <path d="M825 322 V438 H555" class="edge"/>

  <rect x="704" y="92" width="241" height="92" rx="12" fill="#fafafa" stroke="#a1a1aa" stroke-width="1.5"/>
  <text x="825" y="119" text-anchor="middle" class="txt label">Key rule</text>
  <text x="825" y="142" text-anchor="middle" class="txt small">Do not use a premium model</text>
  <text x="825" y="161" text-anchor="middle" class="txt small">as a substitute for safe parallelism.</text>
</svg>