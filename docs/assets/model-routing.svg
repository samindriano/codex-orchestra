<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
<rect width="1000" height="520" fill="#ffffff"/>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker>
  <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
  <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/></marker>
  <style>
    .txt { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#0f172a; }
    .small { font-size:14px; }
    .label { font-size:16px; font-weight:600; }
    .edge { stroke:#334155; stroke-width:2; fill:none; marker-end:url(#arrow); }
    .edge-green { stroke:#16a34a; stroke-width:2; fill:none; marker-end:url(#arrowGreen); }
    .edge-red { stroke:#dc2626; stroke-width:2; fill:none; marker-end:url(#arrowRed); }
  </style>
</defs>
<rect x="60" y="190" width="150" height="44" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="135" y="218" text-anchor="middle" class="txt label">Normal task</text>
<line x1="210" y1="212" x2="270" y2="212" class="edge"/>
<rect x="275" y="170" width="230" height="84" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
<text x="390" y="202" text-anchor="middle" class="txt label">Cost-efficient strong root</text>
<text x="390" y="226" text-anchor="middle" class="txt small">(e.g. Luna xhigh)</text>
<line x1="505" y1="212" x2="565" y2="212" class="edge"/>
<rect x="570" y="170" width="230" height="84" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="685" y="202" text-anchor="middle" class="txt label">Cost-efficient workers</text>
<text x="685" y="226" text-anchor="middle" class="txt small">(e.g. Luna xhigh)</text>
<line x1="800" y1="212" x2="850" y2="212" class="edge"/>
<polygon points="900,160 970,212 900,264 830,212" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
<text x="900" y="218" text-anchor="middle" class="txt label">Result clean?</text>
<path d="M900 264 V300 H745 V330" class="edge-green"/>
<text x="770" y="294" class="txt small" fill="#15803d">yes</text>
<rect x="650" y="332" width="190" height="48" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="745" y="362" text-anchor="middle" class="txt label">Integrate</text>
<path d="M970 212 H990 V420 H760" class="edge-red"/>
<text x="800" y="407" class="txt small" fill="#dc2626">no / ambiguous / high-risk</text>
<rect x="520" y="400" width="240" height="48" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="640" y="430" text-anchor="middle" class="txt label">Bounded escalation</text>
<line x1="520" y1="424" x2="450" y2="424" class="edge"/>
<rect x="200" y="390" width="250" height="68" rx="12" fill="#fff1f2" stroke="#e11d48" stroke-width="2"/>
<text x="325" y="419" text-anchor="middle" class="txt label">Stronger model checkpoint</text>
<text x="325" y="442" text-anchor="middle" class="txt small">(e.g. Sol High)</text>
<path d="M325 390 V355 H650" class="edge"/>
</svg>