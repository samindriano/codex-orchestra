<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/></marker>
    <style>
      .txt { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#0f172a; }
      .small { font-size:13px; }
      .label { font-size:15px; font-weight:600; }
      .title { font-size:18px; font-weight:700; }
      .big { font-size:20px; font-weight:750; }
      .edge { stroke:#334155; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .edge-green { stroke:#16a34a; stroke-width:2; fill:none; marker-end:url(#arrowGreen); }
      .edge-red { stroke:#dc2626; stroke-width:2; fill:none; marker-end:url(#arrowRed); }
      .dash { stroke:#94a3b8; stroke-width:1.5; stroke-dasharray:6 5; fill:none; }
    </style>
  </defs>

  <text x="600" y="30" text-anchor="middle" class="txt big">Latency-aware orchestration</text>
  <text x="600" y="52" text-anchor="middle" class="txt small">Parallelize the current execution frontier; keep dependent decisions sequential.</text>

  <rect x="480" y="72" width="240" height="46" rx="11" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="600" y="101" text-anchor="middle" class="txt label">User goal / source of truth</text>
  <line x1="600" y1="118" x2="600" y2="146" class="edge"/>

  <rect x="390" y="150" width="420" height="74" rx="13" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="600" y="179" text-anchor="middle" class="txt title">MAIN parallelism preflight</text>
  <text x="600" y="202" text-anchor="middle" class="txt small">What can start now? What is independent? What must MAIN retain?</text>
  <line x1="600" y1="224" x2="600" y2="247" class="edge"/>

  <polygon points="600,250 735,296 600,342 465,296" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="290" text-anchor="middle" class="txt label">Useful ready workstreams</text>
  <text x="600" y="311" text-anchor="middle" class="txt small">on the critical path</text>

  <path d="M482 307 H220 V362" class="edge"/>
  <path d="M600 342 V362" class="edge"/>
  <path d="M718 307 H980 V362" class="edge"/>
  <text x="278" y="329" class="txt small">1 / inherently sequential</text>
  <text x="615" y="355" class="txt small">2–3 ready paths</text>
  <text x="811" y="329" class="txt small">3–6 ready paths / review</text>

  <rect x="55" y="370" width="310" height="238" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="210" y="402" text-anchor="middle" class="txt title">DIRECT</text>
  <text x="210" y="424" text-anchor="middle" class="txt small">Exception for substantial work</text>
  <rect x="100" y="448" width="220" height="58" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="210" y="474" text-anchor="middle" class="txt label">MAIN implements</text>
  <text x="210" y="494" text-anchor="middle" class="txt small">+ targeted verification</text>
  <rect x="92" y="528" width="236" height="50" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="210" y="549" text-anchor="middle" class="txt small">If task is substantial, record why</text>
  <text x="210" y="567" text-anchor="middle" class="txt small">workers would not shorten latency.</text>

  <rect x="395" y="370" width="410" height="238" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
  <text x="600" y="402" text-anchor="middle" class="txt title" fill="#1d4ed8">LIGHT · DEFAULT</text>
  <text x="600" y="424" text-anchor="middle" class="txt small">Launch independent work before MAIN duplicates it</text>
  <rect x="425" y="450" width="105" height="54" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="548" y="450" width="105" height="54" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <rect x="671" y="450" width="105" height="54" rx="9" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="477" y="480" text-anchor="middle" class="txt small">Worker A</text>
  <text x="600" y="472" text-anchor="middle" class="txt small">MAIN</text>
  <text x="600" y="490" text-anchor="middle" class="txt small">coupled path</text>
  <text x="723" y="480" text-anchor="middle" class="txt small">Worker B</text>
  <path d="M477 504 V535 H600" class="edge"/>
  <path d="M600 504 V535" class="edge"/>
  <path d="M723 504 V535 H600" class="edge"/>
  <rect x="500" y="536" width="200" height="48" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="565" text-anchor="middle" class="txt label">MAIN integrates evidence</text>

  <rect x="835" y="370" width="310" height="238" rx="16" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="990" y="402" text-anchor="middle" class="txt title" fill="#c2410c">HEAVY</text>
  <text x="990" y="424" text-anchor="middle" class="txt small">Wide frontier / uncertain root cause</text>
  <rect x="862" y="450" width="72" height="52" rx="8" fill="#ffffff" stroke="#ea580c"/>
  <rect x="945" y="450" width="72" height="52" rx="8" fill="#ffffff" stroke="#ea580c"/>
  <rect x="1028" y="450" width="72" height="52" rx="8" fill="#ffffff" stroke="#ea580c"/>
  <text x="898" y="480" text-anchor="middle" class="txt small">A</text>
  <text x="981" y="480" text-anchor="middle" class="txt small">B</text>
  <text x="1064" y="480" text-anchor="middle" class="txt small">C+</text>
  <rect x="905" y="520" width="170" height="42" rx="9" fill="#ffffff" stroke="#ea580c"/>
  <text x="990" y="546" text-anchor="middle" class="txt small">optional independent review</text>
  <path d="M898 502 V578 H990" class="edge"/>
  <path d="M981 502 V578" class="edge"/>
  <path d="M1064 502 V578 H990" class="edge"/>
  <rect x="910" y="570" width="160" height="28" rx="8" fill="#fff" stroke="#ea580c"/>
  <text x="990" y="589" text-anchor="middle" class="txt small">MAIN milestone review</text>

  <path d="M210 608 V650 H510" class="edge"/>
  <path d="M600 608 V650" class="edge"/>
  <path d="M990 608 V650 H690" class="edge"/>
  <rect x="510" y="630" width="180" height="44" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="657" text-anchor="middle" class="txt label">Validation / gate</text>

  <line x1="600" y1="674" x2="600" y2="706" class="edge-green"/>
  <text x="615" y="697" class="txt small" fill="#15803d">PASS</text>
  <rect x="470" y="710" width="260" height="48" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="731" text-anchor="middle" class="txt label">Integrate + refresh status</text>
  <text x="600" y="749" text-anchor="middle" class="txt small">then de-escalate or build next frontier</text>

  <path d="M690 650 H1170 V187 H812" class="edge-red"/>
  <text x="975" y="637" class="txt small" fill="#dc2626">FAIL / BLOCKED → revise frontier</text>
</svg>