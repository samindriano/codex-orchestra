  <text x="895" y="113" text-anchor="middle" class="txt small">PROJECT_PROFILE / TEAM_STATUS</text>
  <text x="895" y="134" text-anchor="middle" class="txt small">CURRENT only when synced to source</text>

  <line x1="355" y1="108" x2="745" y2="108" class="dash"/>
  <text x="550" y="99" text-anchor="middle" class="txt small">sync on material milestone / source-HEAD change</text>
  <text x="550" y="122" text-anchor="middle" class="txt small">source wins on conflict</text>

  <path d="M205 154 V192 H470" class="edge"/>
  <path d="M895 154 V192 H630" class="edge"/>
  <rect x="410" y="190" width="280" height="74" rx="13" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="550" y="219" text-anchor="middle" class="txt title">MAIN</text>
  <text x="550" y="242" text-anchor="middle" class="txt small">decompose · protect gates · integrate</text>

  <line x1="550" y1="264" x2="550" y2="302" class="edge"/>
  <rect x="380" y="306" width="340" height="70" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="550" y="333" text-anchor="middle" class="txt label">Execution frontier</text>
  <text x="550" y="354" text-anchor="middle" class="txt small">independent READY work that can start now</text>
  <text x="550" y="371" text-anchor="middle" class="txt small">DIRECT · LIGHT · HEAVY selected from frontier width</text>

  <path d="M440 376 V408 H225" class="edge"/>
  <path d="M550 376 V408" class="edge"/>
  <path d="M660 376 V408 H875" class="edge"/>

  <rect x="80" y="412" width="290" height="84" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
