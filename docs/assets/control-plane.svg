  <path d="M225 496 V530 H470" class="edge"/>
  <path d="M550 496 V530" class="edge"/>
  <path d="M875 496 V530 H630" class="edge"/>
  <rect x="430" y="524" width="240" height="52" rx="11" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="550" y="547" text-anchor="middle" class="txt label">Verified integration</text>
  <text x="550" y="566" text-anchor="middle" class="txt small">diff + tests + evidence + status refresh</text>
