  <text x="225" y="461" text-anchor="middle" class="txt small">isolated ownership / worktrees</text>
  <text x="225" y="481" text-anchor="middle" class="txt small">implementation · tests · audit · inspection</text>

  <rect x="405" y="412" width="290" height="84" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="550" y="439" text-anchor="middle" class="txt label">MAIN-retained work</text>
  <text x="550" y="461" text-anchor="middle" class="txt small">coupling · architecture · blockers</text>
  <text x="550" y="481" text-anchor="middle" class="txt small">integration prep · final judgment</text>

  <rect x="730" y="412" width="290" height="84" rx="12" fill="#fafafa" stroke="#a1a1aa" stroke-width="2"/>
