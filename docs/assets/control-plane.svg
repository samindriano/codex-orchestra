<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600">
  <rect width="1100" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#334155"/></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/></marker>
    <style>
      .txt { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill:#0f172a; }
      .small { font-size:13px; }
      .label { font-size:15px; font-weight:600; }
      .title { font-size:19px; font-weight:700; }
      .edge { stroke:#334155; stroke-width:2; fill:none; marker-end:url(#arrow); }
      .edge-green { stroke:#16a34a; stroke-width:2; fill:none; marker-end:url(#arrowGreen); }
      .dash { stroke:#94a3b8; stroke-width:1.5; stroke-dasharray:6 5; fill:none; }
    </style>
  </defs>

  <text x="550" y="32" text-anchor="middle" class="txt title">Control plane: source truth → execution frontier → verified integration</text>

  <rect x="55" y="62" width="300" height="92" rx="13" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="205" y="90" text-anchor="middle" class="txt label">Authoritative source project</text>
  <text x="205" y="113" text-anchor="middle" class="txt small">branch / HEAD / CURRENT_STATUS</text>
  <text x="205" y="134" text-anchor="middle" class="txt small">gates + frozen contracts</text>

  <rect x="745" y="62" width="300" height="92" rx="13" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
